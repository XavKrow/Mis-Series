<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Control de Series</title>
    <link rel="stylesheet" href="./css/login.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="login-card">
        <h1>Control de series</h1>
        <div id="auth-form">
            <input type="email" id="email" placeholder="Correo electrónico">
            <input type="password" id="password" placeholder="Contraseña">
            <button id="btn-action">Iniciar Sesión</button>
            <p style="text-align:center; margin-top:15px;">
                <a href="#" onclick="recuperarPassword()" style="color:var(--primary); font-size:0.8rem;">¿Olvidaste tu contraseña?</a>
            </p>
            <p class="toggle-link" id="toggle-auth">¿No tienes cuenta? Regístrate aquí</p>
        </div>
    </div>

    <script type="module" src="./js/login.js"></script>
</body>
</html>
