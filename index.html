<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Control de Series</title>
    <link rel="stylesheet" href="./css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' height='24' viewBox='0 -960 960 960' width='24' fill='%236366f1'%3E%3Cpath d='M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T800-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm-80-160 200-160-200-160v320Z'/%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="login-card">
        <h1>Control de series</h1>
        <div id="auth-form">
            <input type="email" id="email" placeholder="Correo electrónico">

            <div class="password-wrapper" style="position: relative; width: 100%;">
                <input type="password" id="password" placeholder="Contraseña" style="width: 100%;">
                <span class="material-symbols-outlined" id="toggle-password">
                    visibility
                </span>
            </div>

            <button id="btn-action">Iniciar Sesión</button>

            <div class="login-extras">
                <a href="#" onclick="recuperarPassword()" class="link-forgot">¿Olvidaste tu contraseña?</a>
            </div>
            <p class="toggle-link" id="toggle-auth">¿No tienes cuenta? Regístrate aquí</p>
        </div>
    </div>

    <script type="module" src="./js/login.js"></script>
</body>
</html>
