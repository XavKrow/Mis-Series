<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Series</title>
    <style>
        :root { 
            --primary: #3498db; 
            --success: #27ae60; 
            --warning: #f1c40f;
            --danger: #e74c3c;
            --dark: #2c3e50; 
            --orange: #f39c12;
            --bg: #f4f7f6;
            --card-bg: white;
            --text: #2c3e50;
        }

        /* Estilos Modo Oscuro */
        body.dark-mode {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --dark: #34495e;
        }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; }
        
        header { background: #2c3e50; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        
        .add-section { background: var(--card-bg); padding: 20px; margin: 20px auto; max-width: 800px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; gap: 10px; flex-wrap: wrap; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 5px; flex: 1; min-width: 200px; background: var(--card-bg); color: var(--text); font-size: 16px; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Buscador */
        .search-container { max-width: 800px; margin: 0 auto 20px auto; padding: 0 20px; }
        #search-bar { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; }

        .card { 
            background: var(--card-bg); 
            border-radius: 15px; 
            padding: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            transition: 0.3s;
            border-top: 8px solid #ccc;
        }
        .card.viendo { border-top-color: var(--primary); }
        .card.terminada { border-top-color: var(--success); }
        .card.pendiente { border-top-color: var(--danger); }

        .card-img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; border: 1px solid #eee; }

        .card h3 { margin: 0; color: var(--primary); }
        .temp-info { background: rgba(0,0,0,0.05); padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 0.9rem; border-left: 4px solid var(--primary); position: relative; }
        
        .btn-group-edit { position: absolute; right: 5px; top: 5px; display: flex; gap: 3px; }
        .btn-edit-small { color: white; border: none; border-radius: 4px; padding: 3px 6px; font-size: 0.65rem; cursor: pointer; }

        .progress-container { background: #eee; height: 10px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-bar { background: var(--success); height: 100%; transition: width 0.5s; }
        
        .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .btn-cap { background: rgba(0,0,0,0.1); color: var(--text); border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 1.2rem; }

        .stars-container { margin: 10px 0; font-size: 1.4rem; }
        .star { color: #ccc; cursor: pointer; }
        .star.active { color: var(--warning); }

        .status-badge { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; background: rgba(0,0,0,0.1); }

        /* --- MEDIA QUERIES PARA MÓVIL --- */
        @media (max-width: 600px) {
            header { flex-direction: column; padding: 1rem; gap: 15px; text-align: center; }
            .add-section { flex-direction: column; margin: 10px; gap: 10px; }
            input { min-width: 0; width: 100%; }
            .grid { grid-template-columns: 1fr; padding: 10px; }
            .btn-cap { width: 45px; height: 45px; font-size: 1.5rem; } /* Más grande para el pulgar */
            .temp-info { padding-top: 35px; } /* Espacio para los botones de edición que quedan arriba */
        }
    </style>
</head>
<body>

    <header>
        <h1>Control de Series</h1>
        <div>
            <button onclick="toggleDarkMode()" style="background:transparent; border:1px solid white; color:white; padding:5px 10px; border-radius:5px; cursor:pointer; margin-right:10px;">🌙 / ☀️</button>
            <button onclick="logout()" style="background:transparent; color:white; border:1px solid white; padding:5px 10px; border-radius:5px; cursor:pointer;">Salir</button>
        </div>
    </header>

    <section class="add-section">
        <input type="text" id="serie-name" placeholder="Nombre">
        <input type="text" id="serie-map" placeholder="Caps (ej: 8, 9, 8)">
        <input type="text" id="serie-img" placeholder="URL póster">
        <button class="btn-add" id="btn-save">Agregar</button>
    </section>

    <div class="search-container">
        <input type="text" id="search-bar" placeholder="🔍 Buscar serie..." onkeyup="filtrarSeries()">
    </div>

    <div class="grid" id="series-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, updateDoc, doc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxdOcs-arbue2ZMw0ov0vwYnsiYcJaWKo",
            authDomain: "misseriesapp-9ae46.firebaseapp.com",
            projectId: "misseriesapp-9ae46",
            storageBucket: "misseriesapp-9ae46.firebasestorage.app",
            messagingSenderId: "957709827456",
            appId: "1:957709827456:web:070fe276464b3fcc045565",
            measurementId: "G-XJD6D6BYYS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }

        onAuthStateChanged(auth, (user) => {
            if (user) { currentUser = user; cargarSeries(); } 
            else { window.location.href = "index.html"; }
        });

        document.getElementById('btn-save').onclick = async () => {
            const nombre = document.getElementById('serie-name').value;
            const mapaTexto = document.getElementById('serie-map').value;
            const urlImg = document.getElementById('serie-img').value;

            if(nombre && mapaTexto) {
                const mapaCapitulos = mapaTexto.split(',').map(n => parseInt(n.trim()));
                const totalCapsSerie = mapaCapitulos.reduce((a, b) => a + b, 0);

                await addDoc(collection(db, "series"), {
                    userId: currentUser.uid,
                    nombre: nombre,
                    mapaCapitulos: mapaCapitulos,
                    imagen: urlImg || "https://via.placeholder.com/300x450?text=Sin+Portada",
                    tempActual: 1,
                    capActual: 0,
                    vistosGlobal: 0,
                    totalCapsSerie: totalCapsSerie,
                    valoracion: 0,
                    timestamp: Date.now()
                });
                document.getElementById('serie-name').value = "";
                document.getElementById('serie-map').value = "";
                document.getElementById('serie-img').value = "";
            }
        };

        function cargarSeries() {
            const q = query(collection(db, "series"), where("userId", "==", currentUser.uid));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('series-container');
                container.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const capsDeEstaTemp = data.mapaCapitulos[data.tempActual - 1];
                    const porcentaje = Math.round((data.vistosGlobal / data.totalCapsSerie) * 100);
                    let estado = data.vistosGlobal >= data.totalCapsSerie ? "terminada" : (data.vistosGlobal > 0 ? "viendo" : "pendiente");

                    let estrellasHtml = '';
                    for (let i = 1; i <= 5; i++) {
                        estrellasHtml += `<span class="star ${i <= data.valoracion ? 'active' : ''}" onclick="cambiarEstrellas('${id}', ${i})">★</span>`;
                    }

                    container.innerHTML += `
                        <div class="card ${estado}">
                            <img src="${data.imagen || 'https://via.placeholder.com/300x450?text=Sin+Portada'}" class="card-img">
                            <div style="display:flex; justify-content:space-between; align-items:start;">
                                <h3>${data.nombre}</h3>
                                <span class="status-badge">${estado}</span>
                            </div>
                            <div class="temp-info">
                                <div class="btn-group-edit">
                                    <button class="btn-edit-small" style="background:var(--orange)" onclick="editarUltimaTemp('${id}')">+1 Cap Meta</button>
                                    <button class="btn-edit-small" style="background:var(--dark)" onclick="agregarTemporada('${id}')">+ Temp</button>
                                </div>
                                <b>Temp ${data.tempActual} / ${data.mapaCapitulos.length}</b><br>
                                <span>Cap: ${data.capActual} / ${capsDeEstaTemp}</span>
                            </div>
                            <div class="progress-container">
                                <div class="progress-bar" style="width: ${porcentaje}%"></div>
                            </div>
                            <div class="stars-container">${estrellasHtml}</div>
                            <div class="controls">
                                <button class="btn-cap" onclick="modificarProgreso('${id}', -1)">-</button>
                                <div style="text-align:center">
                                    <span style="font-weight:bold; display:block;">${porcentaje}%</span>
                                    <small>${data.vistosGlobal}/${data.totalCapsSerie}</small>
                                </div>
                                <button class="btn-cap" onclick="modificarProgreso('${id}', 1)">+</button>
                            </div>
                            <button onclick="eliminarSerie('${id}')" style="border:none; background:none; cursor:pointer; width:100%; margin-top:15px; font-size:0.8rem; color:#888;">Eliminar Serie</button>
                        </div>`;
                });
            });
        }

        window.toggleDarkMode = () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        };

        window.filtrarSeries = () => {
            const busqueda = document.getElementById('search-bar').value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                const titulo = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = titulo.includes(busqueda) ? "block" : "none";
            });
        };

        window.modificarProgreso = async (id, cambio) => {
            const docRef = doc(db, "series", id);
            const snap = await getDoc(docRef);
            const d = snap.data();
            let { capActual, tempActual, vistosGlobal, mapaCapitulos, totalCapsSerie } = d;
            if (cambio > 0 && vistosGlobal < totalCapsSerie) {
                vistosGlobal++; capActual++;
                if (capActual > mapaCapitulos[tempActual - 1]) {
                    if (tempActual < mapaCapitulos.length) { tempActual++; capActual = 1; }
                }
            } else if (cambio < 0 && vistosGlobal > 0) {
                vistosGlobal--; capActual--;
                if (capActual < 1 && tempActual > 1) {
                    tempActual--; capActual = mapaCapitulos[tempActual - 1];
                }
            }
            await updateDoc(docRef, { capActual, tempActual, vistosGlobal });
        };

        window.agregarTemporada = async (id) => {
            const nuevosCaps = prompt("¿Cuántos capítulos tiene la nueva temporada?");
            if (nuevosCaps && !isNaN(nuevosCaps)) {
                const docRef = doc(db, "series", id);
                const snap = await getDoc(docRef);
                const d = snap.data();
                const nuevoMapa = [...d.mapaCapitulos, parseInt(nuevosCaps)];
                await updateDoc(docRef, { mapaCapitulos: nuevoMapa, totalCapsSerie: d.totalCapsSerie + parseInt(nuevosCaps) });
            }
        };

        window.editarUltimaTemp = async (id) => {
            const docRef = doc(db, "series", id);
            const snap = await getDoc(docRef);
            const d = snap.data();
            let nuevoMapa = [...d.mapaCapitulos];
            const ultimaPos = nuevoMapa.length - 1;
            const nuevoValor = prompt(`La temp actual tiene ${nuevoMapa[ultimaPos]} caps. ¿Nuevo total?`, nuevoMapa[ultimaPos] + 1);
            if (nuevoValor && !isNaN(nuevoValor)) {
                const diferencia = parseInt(nuevoValor) - nuevoMapa[ultimaPos];
                nuevoMapa[ultimaPos] = parseInt(nuevoValor);
                await updateDoc(docRef, { mapaCapitulos: nuevoMapa, totalCapsSerie: d.totalCapsSerie + diferencia });
            }
        };

        window.cambiarEstrellas = async (id, n) => { await updateDoc(doc(db, "series", id), { valoracion: n }); };
        window.eliminarSerie = async (id) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, "series", id)); };
        window.logout = () => signOut(auth);
    </script>
</body>
</html>
