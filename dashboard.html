<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Series</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Control de Series</h1>
        <div>
            <button onclick="toggleDarkMode()" style="background:transparent; border:1px solid white; color:white; padding:5px 10px; border-radius:5px; cursor:pointer; margin-right:10px;">🌙 / ☀️</button>
            <button onclick="logout()" style="background:transparent; color:white; border:1px solid white; padding:5px 10px; border-radius:5px; cursor:pointer;">Salir</button>
        </div>
    </header>

    <section class="add-section">
        <input type="text" id="serie-name" placeholder="Nombre">
        <input type="text" id="serie-map" placeholder="Caps (ej: 8, 9, 8)">
        <input type="text" id="serie-img" placeholder="URL póster">
        <button class="btn-add" id="btn-save">Agregar</button>
    </section>

    <div class="search-container">
        <input type="text" id="search-bar" placeholder="Buscar serie..." onkeyup="filtrarSeries()">
        <select id="sort-filter" onchange="ordenarSeries()">
            <option value="recientes">Nuevas primero</option>
            <option value="antiguas">Más antiguas</option>
            <option value="nombre">Nombre (A-Z)</option>
            <option value="nombre-rev">Nombre (Z-A)</option>
            <option value="progreso-max">Más avance (%)</option>
            <option value="progreso-min">Menos avance (%)</option>
            <option value="valoracion">Mejor puntuadas ★</option>
            <option value="capitulos">Más capítulos totales</option>
        </select>
    </div>

    <div class="grid" id="series-container"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
