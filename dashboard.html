<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' height='24' viewBox='0 -960 960 960' width='24' fill='%236366f1'%3E%3Cpath d='M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T800-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm-80-160 200-160-200-160v320Z'/%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>
<body>

    <header>
        <h1>Control de Series</h1>
        <div class="header-controls">
            <button onclick="toggleDarkMode()" class="btn-header" id="theme-toggle">
                <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
            </button>
            <button class="btn-header" onclick="location.href='stats.html'">Estadísticas</button>
            <button onclick="logout()" class="btn-header">Salir</button>
        </div>
    </header>

    <section class="add-section">
        <input type="text" id="serie-name" placeholder="Nombre de la serie">
        <input type="text" id="serie-map" placeholder="Caps por temp (ej: 8, 10, 8)">
        <input type="text" id="serie-img" placeholder="URL del póster (link de imagen)">
        <button class="btn-add" id="btn-save">Agregar Serie</button>
    </section>

    <div class="search-container">
        <input type="text" id="search-bar" placeholder="Buscar en mi lista..." onkeyup="filtrarSeries()">
        <select id="sort-filter" onchange="ordenarSeries()">
            <option value="recientes">Nuevas primero</option>
            <option value="antiguas">Más antiguas</option>
            <option value="nombre">Nombre (A-Z)</option>
            <option value="nombre-rev">Nombre (Z-A)</option>
            <option value="progreso-max">Más avance (%)</option>
            <option value="progreso-min">Menos avance (%)</option>
            <option value="valoracion">Mejor puntuadas ★</option>
            <option value="capitulos">Más capítulos totales</option>
        </select>
    </div>

    <main class="grid" id="series-container"></main>

    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Editar Serie</h2>
            <div class="modal-inputs">
                <label>Nombre de la serie</label>
                <input type="text" id="edit-name">
                
                <label>URL del Póster</label>
                <input type="text" id="edit-img">
                
                <label>Capítulos por temporada (separados por coma)</label>
                <input type="text" id="edit-map" placeholder="ej: 8, 10, 8">

                <label>Minutos promedio por capítulo</label>
                <input type="number" id="edit-episodio-duracion" placeholder="Ej: 24">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="window.cerrarModal()">Cancelar</button>
                <button class="btn-save-modal" id="btn-update-confirm">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <div id="quick-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 350px;">
            <h2 id="quick-modal-title">Título Dinámico</h2>
            <div class="modal-inputs">
                <label id="quick-modal-label">Descripción</label>
                <input type="number" id="quick-modal-input" placeholder="0">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="window.cerrarQuickModal()">Cancelar</button>
                <button class="btn-save-modal" id="btn-quick-confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
